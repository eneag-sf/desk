  <style>
    :root { color-scheme: light; }
    html,body{height:100%;margin:0}
    body{
      display:grid;place-items:center;padding:24px;box-sizing:border-box;
      font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#FAF7EF;color:#14301f;
    }
    .card{
      width:100%;max-width:360px;text-align:center;
    }
    .marchio{width:min(62vw,232px);height:auto;margin:0 auto 18px;display:block}
    p.sub{margin:0 0 24px;color:#7d8a80;font-size:14px}
    input{
      width:100%;box-sizing:border-box;padding:13px 15px;font-size:16px;
      border-radius:12px;border:1px solid #ddd6c6;background:#fff;color:#14301f;
      outline:none;transition:border-color .15s;text-align:center;
    }
    input:focus{border-color:#c4622d}
    button{
      width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:600;
      border:0;border-radius:12px;background:#c4622d;color:#fff;cursor:pointer;
      transition:transform .15s,background .15s;
    }
    button:active{transform:scale(.97)}
    button:disabled{opacity:.6;cursor:default}
    .err{color:#b23c24;font-size:13.5px;margin:14px 0 0;min-height:1.2em}
    .remember{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;color:#7d8a80;font-size:13px;cursor:pointer}
    .remember input{width:auto;margin:0}
    .spinner{display:none}
    .loading .form{display:none}
    .loading .spinner{display:block;color:#7d8a80;font-size:14px;margin-top:6px}
  </style>

  <script>
  (function () {
    var cfg = JSON.parse(document.getElementById('desk-payload').textContent);
    var card = document.getElementById('card');
    var form = document.getElementById('form');
    var pw = document.getElementById('pw');
    var err = document.getElementById('err');
    var btn = document.getElementById('btn');
    var rememberBox = document.getElementById('remember');
    var KEY = 'desk-unlock:' + location.pathname;

    // L'app resta disponibile offline anche prima dello sblocco.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // Controlla subito se c'è una versione nuova pubblicata.
        reg.update().catch(function () {});
      }).catch(function () {});
    }

    function b64ToBytes(b64) {
      var bin = atob(b64), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function getSaved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function save(p) { try { localStorage.setItem(KEY, p); } catch (e) {} }
    function forget() { try { localStorage.removeItem(KEY); } catch (e) {} }

    async function decrypt(password) {
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBytes(cfg.salt), iterations: cfg.iter, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var ptBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBytes(cfg.iv) }, key, b64ToBytes(cfg.ct));
      return new TextDecoder().decode(ptBuf);
    }
    function render(htmlText) { document.open(); document.write(htmlText); document.close(); }

    if (!(window.crypto && window.crypto.subtle)) {
      err.textContent = 'Questo browser non può aprire la pagina (serve https).';
      return;
    }

    // Già sbloccata su questo dispositivo? Si apre da sola, senza chiedere nulla.
    var saved = getSaved();
    if (saved) {
      card.classList.add('loading');
      decrypt(saved).then(render).catch(function () {
        forget();
        card.classList.remove('loading');
        pw.focus();
      });
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Apro…';
      try {
        var htmlText = await decrypt(pw.value);
        if (rememberBox.checked) save(pw.value); else forget();
        render(htmlText);
      } catch (ex) {
        err.textContent = 'Password errata — riprova.';
        btn.disabled = false; btn.textContent = 'Apri';
        pw.select();
      }
    });
  })();
  </script>
